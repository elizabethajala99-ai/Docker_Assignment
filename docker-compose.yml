version: '3.8'

services:
  # WordPress with Apache for Cloudboosta Website
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile.wordpress
    container_name: cloudboosta-wordpress
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - wordpress_data:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      - db
    networks:
      - cloudboosta_network

  # MySQL Database for WordPress CMS
  db:
    image: mysql:8.0
    container_name: cloudboosta-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cloudboosta_network
    command: '--default-authentication-plugin=mysql_native_password'

  # phpMyAdmin for Database Management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: cloudboosta-phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      - db
    networks:
      - cloudboosta_network

# Named Volumes for Data Persistence
volumes:
  wordpress_data:
    driver: local
  db_data:
    driver: local

# Custom Network for Service Communication
networks:
  cloudboosta_network:
    driver: bridge